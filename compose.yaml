name: bagua-webgis

services:
  database:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bagua_webgis}
      POSTGRES_USER: ${POSTGRES_USER:-bagua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT PostGIS_Version()" > /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-bagua_webgis}
      PGUSER: ${POSTGRES_USER:-bagua}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
      # BAGUA MASTER: módulo independiente; false lo desactiva sin afectar al WebGIS municipal.
      BAGUA_MASTER_ENABLED: ${BAGUA_MASTER_ENABLED:-true}
      BAGUA_MASTER_DATA_DIR: /app/data/bagua-master
    volumes:
      # Datos de BAGUA MASTER (teselas, glifos, paquete): solo lectura.
      - ./data/bagua-master:/app/data/bagua-master:ro
    depends_on:
      database:
        condition: service_healthy
    networks: [web, data]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
        VITE_BAGUA_MASTER_ENABLED: ${BAGUA_MASTER_ENABLED:-true}
        VITE_MUNICIPAL_MAP_ENABLED: ${MUNICIPAL_MAP_ENABLED:-true}
    restart: unless-stopped
    networks: [web]
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    volumes:
      - ./infrastructure/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [web]
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  web:
  data:
    internal: true
