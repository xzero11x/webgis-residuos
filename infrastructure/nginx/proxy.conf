server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # GeoJSON review layers are several MB uncompressed.
    gzip on;
    gzip_types application/json application/geo+json;
    gzip_min_length 1024;

    # Docker DNS is re-resolved when a backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:3000;
    set $web_upstream http://frontend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
